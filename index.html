<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>短视频语音交互原型</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 视频 Feed 容器 -->
<div id="app">
  <!-- 顶部状态栏 -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="status-icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="white"><rect x="0" y="4" width="3" height="8" rx="0.5"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="0.5"/><rect x="9" y="0.5" width="3" height="11.5" rx="0.5"/><rect x="13.5" y="0" width="2.5" height="12" rx="0.5"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="white"><rect x="0" y="0" width="22" height="12" rx="2" stroke="white" stroke-width="1" fill="none"/><rect x="1.5" y="1.5" width="16" height="9" rx="1" fill="white"/><rect x="23" y="3.5" width="1.5" height="5" rx="0.5" fill="white"/></svg>
    </div>
  </div>

  <!-- 顶部导航 -->
  <div class="top-nav">
    <span class="nav-item">关注</span>
    <span class="nav-item active">推荐</span>
    <span class="nav-item">热点</span>
    <span class="nav-item">商城</span>
  </div>

  <!-- 视频 Feed -->
  <div id="videoFeed" class="video-feed">
    <!-- 视频页面由 JS 动态生成 -->
  </div>

  <!-- 右侧操作栏 -->
  <div class="action-bar" id="actionBar">
    <div class="action-item avatar-action">
      <div class="avatar-ring">
        <img class="avatar" id="currentAvatar" src="" alt="">
      </div>
      <div class="follow-badge">+</div>
    </div>
    <div class="action-item">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <span class="action-count" id="likeCount">12.8w</span>
    </div>
    <div class="action-item">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="action-count" id="commentCount">3421</span>
    </div>
    <div class="action-item">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
      <span class="action-count">分享</span>
    </div>
    <div class="action-item music-disc">
      <div class="disc-rotate">
        <img class="disc-cover" id="discCover" src="" alt="">
      </div>
    </div>
  </div>

  <!-- 底部信息栏 -->
  <div class="bottom-info" id="bottomInfo">
    <div class="author-name" id="authorName">@用户名</div>
    <div class="video-desc" id="videoDesc">视频描述文字 #标签1 #标签2</div>
    <div class="music-info">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="white"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      <span class="music-name" id="musicName">原声音乐 - 创作者名</span>
    </div>
  </div>

  <!-- 语音按钮 -->
  <div class="voice-btn-container">
    <button id="voiceBtn" class="voice-btn">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="white">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
    <span class="voice-hint">长按说话</span>
  </div>

  <!-- 底部 Tab 栏 -->
  <div class="tab-bar">
    <div class="tab-item active">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="white"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>首页</span>
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="rgba(255,255,255,0.5)"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      <span>朋友</span>
    </div>
    <div class="tab-item add-tab">
      <div class="add-btn">
        <span>+</span>
      </div>
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="rgba(255,255,255,0.5)"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      <span>消息</span>
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="rgba(255,255,255,0.5)"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>我</span>
    </div>
  </div>

  <!-- ========== 语音录入蒙层 (P2) ========== -->
  <div id="voiceOverlay" class="voice-overlay hidden">
    <div class="voice-recording-area">
      <!-- 声波动画 -->
      <div class="wave-container" id="waveContainer">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <!-- 语音按钮 (录入状态) -->
      <div class="voice-active-btn">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="white">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </div>
      <!-- 实时转写文字 -->
      <div class="transcription" id="transcription"></div>
      <!-- 提示 -->
      <div class="voice-tip" id="voiceTip">松开发送，上滑取消</div>
    </div>
  </div>

  <!-- ========== 意图理解中 (P3) ========== -->
  <div id="processingOverlay" class="processing-overlay hidden">
    <div class="processing-content">
      <div class="processing-dots">
        <span></span><span></span><span></span>
      </div>
      <div class="processing-text">正在理解你的需求...</div>
      <div class="processing-query" id="processingQuery"></div>
    </div>
  </div>

  <!-- ========== 结果浮层 P4a: 视频搜索结果 ========== -->
  <div id="resultVideo" class="result-panel hidden">
    <div class="result-panel-bg" onclick="closeAllPanels()"></div>
    <div class="result-sheet result-sheet-tall">
      <div class="sheet-handle"><div class="handle-bar"></div></div>
      <div class="result-header">
        <div class="result-query-tag">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="#fe2c55"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
          <span id="videoQueryText"></span>
        </div>
        <div class="result-count" id="videoResultCount"></div>
      </div>
      <div class="video-results-grid" id="videoResultsGrid">
        <!-- JS 填充 -->
      </div>
    </div>
  </div>

  <!-- ========== 结果浮层 P4b: LBS 商家推荐 ========== -->
  <div id="resultLBS" class="result-panel hidden">
    <div class="result-panel-bg" onclick="closeAllPanels()"></div>
    <div class="result-sheet result-sheet-tall">
      <div class="sheet-handle"><div class="handle-bar"></div></div>
      <div class="result-header">
        <div class="result-query-tag">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="#fe2c55"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          <span id="lbsQueryText"></span>
        </div>
      </div>
      <!-- 模拟地图 -->
      <div class="lbs-map" id="lbsMap">
        <div class="map-bg">
          <div class="map-pin" style="top:35%;left:30%"><div class="pin-dot"></div><span>1</span></div>
          <div class="map-pin" style="top:25%;left:55%"><div class="pin-dot"></div><span>2</span></div>
          <div class="map-pin" style="top:45%;left:70%"><div class="pin-dot"></div><span>3</span></div>
          <div class="map-pin highlight" style="top:50%;left:45%"><div class="pin-dot current"></div><span>我</span></div>
        </div>
      </div>
      <div class="lbs-list" id="lbsList">
        <!-- JS 填充 -->
      </div>
    </div>
  </div>

  <!-- ========== 结果浮层 P4c: 商品识别 ========== -->
  <div id="resultProduct" class="result-panel hidden">
    <div class="result-panel-bg" onclick="closeAllPanels()"></div>
    <div class="result-sheet">
      <div class="sheet-handle"><div class="handle-bar"></div></div>
      <div class="result-header">
        <div class="result-query-tag">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="#fe2c55"><path d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 16H6V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/></svg>
          <span>同款商品</span>
        </div>
      </div>
      <!-- 视频截帧 -->
      <div class="product-source">
        <div class="source-frame" id="sourceFrame">
          <div class="frame-highlight"></div>
        </div>
        <span class="source-label">识别区域</span>
      </div>
      <div class="product-list" id="productList">
        <!-- JS 填充 -->
      </div>
    </div>
  </div>

  <!-- ========== 结果浮层 P4d: AI 问答 ========== -->
  <div id="resultQA" class="result-panel hidden">
    <div class="result-panel-bg" onclick="closeAllPanels()"></div>
    <div class="result-sheet result-sheet-qa">
      <div class="sheet-handle"><div class="handle-bar"></div></div>
      <div class="qa-header">
        <div class="qa-avatar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#fe2c55"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <span class="qa-title">AI 助手</span>
      </div>
      <div class="qa-question" id="qaQuestion"></div>
      <div class="qa-answer" id="qaAnswer"></div>
    </div>
  </div>

  <!-- 场景切换提示 (演示模式) -->
  <div id="demoHint" class="demo-hint hidden">
    <span id="demoHintText"></span>
  </div>

  <!-- 桌面端使用提示 -->
  <div class="desktop-tips" id="desktopTips">
    <div class="desktop-tips-content">
      <h3>短视频语音交互原型</h3>
      <p>滚轮上下滑动：切换视频</p>
      <p>长按红色麦克风按钮：触发语音交互</p>
      <p>每次长按展示不同场景（共4种）</p>
      <p>点击灰色背景：关闭结果浮层</p>
      <button onclick="this.parentElement.parentElement.style.display='none'">知道了</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
